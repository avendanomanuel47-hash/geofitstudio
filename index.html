<style>
  :root{
    --bg:#1B1D1F; --surface:#232629; --surface2:#2A2E31; --surface3:#303538;
    --border:#383D40; --accent:#22C1E8; --accent-dim:#0F5C6E; --accent2:#3DDC97;
    --danger:#FF4757; --warning:#FFC145; --text:#F5F3EF; --muted:#9AA0A6; --faint:#6B7075;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;width:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;width:100%;}
  #app{max-width:820px;margin:0 auto;padding:16px;overflow-x:hidden;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border-bottom:1px solid var(--border);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px 16px;
    margin:-16px -16px 20px -16px;position:sticky;top:0;z-index:10;}
  #app{padding-bottom:env(safe-area-inset-bottom);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:36px;height:36px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;color:#1B1D1F;font-size:18px;}
  .brand h1{font-size:17px;margin:0;text-transform:uppercase;letter-spacing:0.5px;font-weight:900;}
  .brand .sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px 0;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;min-width:0;}
  .grid{min-width:0;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .grid{display:grid;gap:10px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:600px){.grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;}}
  label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:4px;}
  input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 12px;font-size:14px;}
  input::placeholder{color:var(--faint);}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.5px;font-size:12px;}
  .btn-primary{background:var(--accent);color:#1B1D1F;}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:rgba(255,71,87,0.15);color:var(--danger);border:1px solid rgba(255,71,87,0.4);}
  button:hover{opacity:0.9;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.5px;padding:4px 9px;border-radius:20px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);}
  .tab.active{border-color:var(--accent);color:var(--accent);}
  .err{color:var(--danger);font-size:12px;font-weight:700;}
  .ok{color:var(--accent2);font-size:12px;font-weight:700;}
  .faint{color:var(--faint);font-size:13px;}
  .muted{color:var(--muted);font-size:13px;}
  .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .stat-value{font-size:26px;font-weight:900;}
  .board{overflow-x:auto;margin:0 -16px;padding:0 16px;}
  .card .board{margin:0 -18px;padding:0 18px;}
  .board-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-width:680px;}
  .day-head{text-align:center;border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;padding:8px;background:var(--surface2);}
  .day-head.today{background:var(--accent-dim);}
  .day-num{font-weight:900;font-size:15px;}
  .day-dow{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .slot-list{border:1px solid var(--border);border-radius:0 0 8px 8px;overflow:hidden;}
  .slot-btn{display:block;width:100%;text-align:left;padding:8px;font-size:11px;border:none;border-top:1px solid var(--border);
    background:var(--surface);color:var(--text);cursor:pointer;}
  .slot-btn:hover{opacity:0.9;}
  .slot-btn.active{background:var(--accent);color:#1B1D1F;}
  .slot-btn.ocupado{background:rgba(34,193,232,0.16);}
  .slot-btn.mine{background:rgba(61,220,151,0.18);}
  .slot-btn.full{background:rgba(255,71,87,0.16);}
  .slot-btn:disabled{opacity:0.45;cursor:not-allowed;}
  .slot-count{font-weight:900;}
  .list-item{display:flex;align-items:center;justify-content:between;background:var(--surface2);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:13px;}
  .list-item span:last-child{margin-left:auto;font-weight:700;}
  a.link{color:var(--accent);text-decoration:none;font-weight:700;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);
    text-transform:uppercase;letter-spacing:2px;font-size:13px;}
  .btn-icon{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-size:14px;line-height:1;display:inline-flex;align-items:center;gap:6px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-start;
    justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));
    overflow-y:auto;z-index:100;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;
    max-width:380px;width:100%;margin-top:24px;}
  .modal-box h2{margin-bottom:2px;}
  .qr-wrap{display:flex;justify-content:center;background:#fff;border-radius:10px;padding:14px;margin:14px 0;}
  .link-copy{display:flex;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;margin-bottom:14px;}
  .link-copy span{flex:1;font-size:12px;color:var(--text);word-break:break-all;}
  .share-steps{margin-bottom:14px;}
  .share-steps h3{font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent);margin:0 0 6px 0;}
  .share-steps ol{margin:0 0 14px 18px;padding:0;font-size:13px;color:var(--text);line-height:1.5;}
  .share-steps li{margin-bottom:2px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando Geofit Studio…</div></div>

<script>
/* =========================================================
   1) CONFIGURACION DE FIREBASE
   Reemplaza este objeto con el que copiaste desde tu proyecto
   de Firebase (Configuracion del proyecto > Tus apps > Web).
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBqCNtSfXK2Cn7TPDEAAlnIEHtHrfxOAw0",
  authDomain: "geofitstudio.firebaseapp.com",
  projectId: "geofitstudio",
  storageBucket: "geofitstudio.firebasestorage.app",
  messagingSenderId: "1059750270809",
  appId: "1:1059750270809:web:bc2a8293357404d2241e48"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// App secundaria: permite que un admin cree cuentas nuevas sin perder su propia sesion.
const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = secondaryApp.auth();

/* =========================================================
   2) CONSTANTES DEL GIMNASIO (valores por defecto — el admin puede cambiarlos
      desde la pestaña "Ajustes"; una vez guardados, viven en Firestore en
      config/ajustes y estos valores solo se usan si ese documento no existe)
   ========================================================= */
const DEFAULT_AJUSTES = {
  capacidad: 5,
  horasAnticipacion: 3,
  // Horarios de la mañana: lunes a jueves
  horasManana: [
    { id: "h07", hora: 7 },
    { id: "h08", hora: 8 },
  ],
  // Horarios de la tarde: lunes a viernes
  horasTarde: [
    { id: "h16", hora: 16 },
    { id: "h17", hora: 17 },
    { id: "h18", hora: 18 },
    { id: "h19", hora: 19 },
  ],
  // Sábado (sin contar el running club)
  horasSabado: [
    { id: "h08sab", hora: 8 },
    { id: "h09sab", hora: 9 },
  ],
  // Running club de sábado. null = desactivado.
  runningClub: { id: "h06run", hora: 6 },
};
const DIAS_CORTO = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MAX_CLIENTES = 40;
const DOMINIO_CLIENTES = "clientes.forja-gym.app"; // dominio ficticio para usuarios sin correo real
const APP_URL = "https://avendanomanuel47-hash.github.io/geofitstudio/"; // enlace público para instalar la app

function ajustesActuales(){ return ctx.ajustes || DEFAULT_AJUSTES; }
function labelSlot(hora, esRunning){
  const h = Number(hora);
  const fmt = (x) => `${String(x%24).padStart(2,"0")}:00`;
  return `${fmt(h)} – ${fmt(h+1)}${esRunning?" · Running Club":""}`;
}

/* =========================================================
   3) UTILIDADES
   ========================================================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function addMonths(s,n){ const d=new Date(s+"T00:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function mondayOf(s){ const d=new Date(s+"T00:00:00"); const day=d.getDay(); const diff=day===0?-6:1-day; d.setDate(d.getDate()+diff); return d.toISOString().slice(0,10); }
function slotsForDate(s){
  const aj = ajustesActuales();
  const day=new Date(s+"T00:00:00").getDay();
  if(day===0) return [];               // domingo: sin clases
  if(day===6){                          // sábado
    const arr = aj.runningClub ? [{...aj.runningClub, label:labelSlot(aj.runningClub.hora,true)}] : [];
    return [...arr, ...aj.horasSabado.map(s=>({...s, label:labelSlot(s.hora)}))];
  }
  if(day===5) return aj.horasTarde.map(s=>({...s, label:labelSlot(s.hora)})); // viernes: solo tarde
  return [...aj.horasManana.map(s=>({...s, label:labelSlot(s.hora)})), ...aj.horasTarde.map(s=>({...s, label:labelSlot(s.hora)}))]; // lunes a jueves
}
function fmtFecha(s){ return new Date(s+"T00:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"}); }
function imc(peso,alturaCm){ if(!peso||!alturaCm) return null; const m=alturaCm/100; return peso/(m*m); }
function imcCategoria(v){ if(v==null) return {t:"Sin datos",c:"var(--faint)"}; if(v<18.5) return {t:"Bajo peso",c:"var(--warning)"};
  if(v<25) return {t:"Normal",c:"var(--accent2)"}; if(v<30) return {t:"Sobrepeso",c:"var(--warning)"}; return {t:"Obesidad",c:"var(--danger)"}; }
function estadoPago(prox){ if(!prox) return {t:"Sin registro",c:"var(--faint)"};
  const diff=(new Date(prox+"T00:00:00")-new Date(todayStr()+"T00:00:00"))/86400000;
  if(diff<0) return {t:"Vencido",c:"var(--danger)"}; if(diff<=7) return {t:"Próximo a vencer",c:"var(--warning)"};
  return {t:"Al día",c:"var(--accent2)"}; }
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDinero(n){ return "$" + Math.round(n||0).toLocaleString("es-ES"); }
function nombreMes(mesKey){ const [y,m] = mesKey.split("-"); const d = new Date(Number(y), Number(m)-1, 1); return d.toLocaleDateString("es-ES",{month:"short",year:"2-digit"}); }
function usuarioToEmail(u){ const limpio=u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""); return `${limpio}@${DOMINIO_CLIENTES}`; }
function allSlots(){
  const aj = ajustesActuales();
  return [...(aj.runningClub?[aj.runningClub]:[]), ...aj.horasManana, ...aj.horasTarde, ...aj.horasSabado]
    .map(s=>({...s, label:labelSlot(s.hora, aj.runningClub && s.id===aj.runningClub.id)}));
}
function inicioSlot(fecha, slot){ const d = new Date(fecha+"T00:00:00"); d.setHours(slot.hora,0,0,0); return d; }
function faltaAnticipacion(fecha, slot){
  const limite = new Date(Date.now() + ajustesActuales().horasAnticipacion*60*60*1000);
  return inicioSlot(fecha, slot) < limite;

}

// --- Rachas, insignias y cumpleaños ---
function totalAsistencias(clienteId){
  return ctx.asignaciones.filter(a=>a.clienteId===clienteId && a.asistio===true).length;
}
function calcularRacha(clienteId){
  const semanas = new Set(ctx.asignaciones.filter(a=>a.clienteId===clienteId && a.asistio===true).map(a=>mondayOf(a.fecha)));
  let racha = 0, semana = mondayOf(todayStr());
  while (semanas.has(semana)) { racha++; semana = addDays(semana, -7); }
  return racha;
}
const NIVELES_INSIGNIA = [
  { n:10, e:"🥉", label:"10 clases" },
  { n:25, e:"🥈", label:"25 clases" },
  { n:50, e:"🥇", label:"50 clases" },
  { n:100, e:"💎", label:"100 clases" },
];
const NIVELES_RACHA = [
  { n:4, e:"🔥", label:"4 semanas seguidas" },
  { n:8, e:"🔥🔥", label:"8 semanas seguidas" },
  { n:12, e:"🔥🔥🔥", label:"12 semanas seguidas" },
];
function insigniasCliente(clienteId){
  const total = totalAsistencias(clienteId);
  const racha = calcularRacha(clienteId);
  return [
    ...NIVELES_INSIGNIA.filter(x=>total>=x.n).map(x=>({...x})),
    ...NIVELES_RACHA.filter(x=>racha>=x.n).map(x=>({...x})),
  ];
}
function mejorInsignia(clienteId){
  const ins = insigniasCliente(clienteId);
  return ins.length ? ins[ins.length-1].e : "";
}
function esCumpleañosHoy(fechaNac){
  if (!fechaNac) return false;
  const hoy = new Date(); const d = new Date(fechaNac+"T00:00:00");
  return d.getDate()===hoy.getDate() && d.getMonth()===hoy.getMonth();
}
function diasHastaCumple(fechaNac){
  if (!fechaNac) return 999;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const d = new Date(fechaNac+"T00:00:00");
  let prox = new Date(hoy.getFullYear(), d.getMonth(), d.getDate());
  if (prox < hoy) prox = new Date(hoy.getFullYear()+1, d.getMonth(), d.getDate());
  return Math.round((prox - hoy) / 86400000);
}



/* =========================================================
   4) ESTADO GLOBAL
   ========================================================= */
const EMOJIS = ["👍","🔥","💪","👏"];

let ctx = {
  cargando: true,
  user: null,
  rol: null,        // 'admin' | 'cliente' | null
  adminDoc: null,
  clienteDoc: null,
  admins: [],
  clientes: [],
  asignaciones: [],
  perfiles: [],
  reacciones: [],
  setupExiste: null,
  adminTab: "clientes",
  mesFinanzas: null,
  clienteTab: "reservar", // reservar | muro | top
  weekStart: mondayOf(todayStr()),
  selected: null,
  error: "",
  mostrarCompartir: false,
  ajustes: null,
  editandoAjustes: false,
};
let unsubs = [];
function limpiarListeners(){ unsubs.forEach(u=>u&&u()); unsubs=[]; }
function nombrePerfil(uid){ const p = ctx.perfiles.find(x=>x.id===uid); return p ? p.nombre : "Alguien"; }

const app = document.getElementById("app");

/* =========================================================
   5) AUTENTICACION
   ========================================================= */
auth.onAuthStateChanged(async (user) => {
  limpiarListeners();
  ctx.error = "";
  if (!user) {
    ctx.user = null; ctx.rol = null; ctx.adminDoc = null; ctx.clienteDoc = null;
    const setupSnap = await db.collection("config").doc("setup").get();
    ctx.setupExiste = setupSnap.exists;
    ctx.cargando = false;
    render();
    return;
  }
  ctx.user = user;
  const [adminSnap, clienteSnap, setupSnap] = await Promise.all([
    db.collection("admins").doc(user.uid).get(),
    db.collection("clientes").doc(user.uid).get(),
    db.collection("config").doc("setup").get(),
  ]);
  ctx.setupExiste = setupSnap.exists;

  if (adminSnap.exists) {
    ctx.rol = "admin"; ctx.adminDoc = adminSnap.data();
    suscribirAdmin();
  } else if (clienteSnap.exists) {
    ctx.rol = "cliente"; ctx.clienteDoc = { id: user.uid, ...clienteSnap.data() };
    suscribirCliente();
  } else {
    ctx.rol = null;
  }
  ctx.cargando = false;
  render();
});

function suscribirAdmin(){
  unsubs.push(db.collection("admins").onSnapshot(qs=>{
    ctx.admins = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("clientes").onSnapshot(qs=>{
    ctx.clientes = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("asignaciones").onSnapshot(qs=>{
    ctx.asignaciones = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("perfiles").onSnapshot(qs=>{
    ctx.perfiles = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("config").doc("ajustes").onSnapshot(d=>{
    ctx.ajustes = d.exists ? d.data() : null; render();
  }));
}
function suscribirCliente(){
  unsubs.push(db.collection("clientes").doc(ctx.user.uid).onSnapshot(d=>{
    if(d.exists) ctx.clienteDoc = { id:d.id, ...d.data() }; render();
  }));
  // Todas las asignaciones (no solo las propias): hacen falta para el Muro y el Top 10.
  unsubs.push(db.collection("asignaciones").onSnapshot(qs=>{
    ctx.asignaciones = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("clientes").onSnapshot(qs=>{
    // se usa solo para saber cuantos clientes hay por dia al reservar (conteo por franja)
    ctx.clientes = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("perfiles").onSnapshot(qs=>{
    ctx.perfiles = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("reacciones").onSnapshot(qs=>{
    ctx.reacciones = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("config").doc("ajustes").onSnapshot(d=>{
    ctx.ajustes = d.exists ? d.data() : null; render();
  }));
}

async function iniciarSesion(usuarioOCorreo, password){
  const email = usuarioOCorreo.includes("@") ? usuarioOCorreo.trim() : usuarioToEmail(usuarioOCorreo);
  await auth.signInWithEmailAndPassword(email, password);
}
async function cerrarSesion(){ await auth.signOut(); }

/* =========================================================
   6) RENDER PRINCIPAL
   ========================================================= */
function render(){
  if (ctx.cargando){ app.innerHTML = `<div class="loading">Cargando Geofit Studio…</div>`; return; }

  let header = `
    <header>
      <div class="brand">
        <div class="logo">G</div>
        <div><h1>Geofit Studio</h1><div class="sub">Panel del gimnasio</div></div>
      </div>
      <div class="row">
        <span class="muted" style="display:none" class="sub-name">${ctx.user?esc(ctx.rol==="admin"?ctx.adminDoc?.nombre:ctx.clienteDoc?.nombre):""}</span>
        <button class="btn-icon" id="btnCompartirApp" title="Compartir aplicación">🔗 Compartir</button>
        ${ctx.user ? `<button class="btn-ghost" id="btnSalir">Salir</button>` : ``}
      </div>
    </header>`;

  let body = "";
  if (!ctx.user) {
    body = viewLogin();
  } else if (ctx.rol === "admin") {
    body = viewAdmin();
  } else if (ctx.rol === "cliente") {
    body = viewCliente();
  } else if (!ctx.setupExiste) {
    body = viewBootstrap();
  } else {
    body = viewSinRol();
  }

  app.innerHTML = header + body + (ctx.mostrarCompartir ? viewCompartirModal() : "");
  bindEvents();

function viewAdminFinanzas(){
  const pagos = ctx.clientes.flatMap(c => (c.pagos||[]).map(p=>({...p, clienteNombre:c.nombre})));
  const porMes = {};
  pagos.forEach(p=>{ const mes = (p.fecha||"").slice(0,7); if(mes) porMes[mes] = (porMes[mes]||0) + Number(p.monto||0); });

  const mesActual = todayStr().slice(0,7);
  const mesesConDatos = Object.keys(porMes);
  // Aseguramos que siempre se vean los últimos 12 meses aunque no todos tengan pagos
  const ultimos12 = [];
  for (let i=11; i>=0; i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    ultimos12.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  const maxMonto = Math.max(1, ...ultimos12.map(m=>porMes[m]||0));
  const totalMesActual = porMes[mesActual] || 0;
  const cantidadMesActual = pagos.filter(p=>(p.fecha||"").slice(0,7)===mesActual).length;

  const mesSeleccionado = ctx.mesFinanzas || mesActual;
  const pagosDelMes = pagos.filter(p=>(p.fecha||"").slice(0,7)===mesSeleccionado).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const totalMesSeleccionado = pagosDelMes.reduce((s,p)=>s+Number(p.monto||0),0);

  const pendientes = ctx.clientes.filter(c=>{ const e = estadoPago(c.proximoPago); return e.t==="Vencido" || e.t==="Próximo a vencer"; });
  const totalPendiente = pendientes.reduce((s,c)=>s+Number(c.montoMensualidad||0),0);

  return `
  <div class="grid" style="gap:16px;">
    <div class="card">
      <div class="stat-label">Ingresos de ${nombreMes(mesActual)}</div>
      <div class="stat-value" style="font-size:34px;">${fmtDinero(totalMesActual)}</div>
      <div class="faint" style="margin-top:4px;">${cantidadMesActual} pago${cantidadMesActual===1?"":"s"} registrado${cantidadMesActual===1?"":"s"} este mes</div>
    </div>

    <div class="card">
      <h2>Últimos 12 meses</h2>
      <div style="display:flex;align-items:flex-end;gap:6px;height:130px;">
        ${ultimos12.map(m=>{
          const monto = porMes[m]||0;
          const alto = Math.max(3, Math.round((monto/maxMonto)*100));
          const activo = m===mesSeleccionado;
          return `<button data-mesfin="${m}" title="${nombreMes(m)}: ${fmtDinero(monto)}"
            style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:none;border:none;cursor:pointer;padding:0;height:100%;">
            <div style="width:100%;height:${alto}px;background:${activo?"var(--accent)":"var(--surface3)"};border-radius:4px 4px 0 0;"></div>
            <div style="font-size:9px;color:${activo?"var(--accent)":"var(--muted)"};margin-top:4px;">${nombreMes(m)}</div>
          </button>`;
        }).join("")}
      </div>
    </div>

    <div class="card">
      <h2>Detalle de ${nombreMes(mesSeleccionado)}</h2>
      <div class="stat-value" style="margin-bottom:10px;">${fmtDinero(totalMesSeleccionado)}</div>
      ${pagosDelMes.length===0 ? `<div class="faint">Sin pagos registrados en este mes.</div>` :
        pagosDelMes.map(p=>`<div class="list-item"><span>${esc(p.clienteNombre)} · ${fmtFecha(p.fecha)}</span><span>${fmtDinero(p.monto)}</span></div>`).join("")}
    </div>

    <div class="card">
      <h2>Pendiente de cobro</h2>
      <div class="stat-value" style="color:var(--warning);">${fmtDinero(totalPendiente)}</div>
      <div class="faint" style="margin-bottom:10px;">Suma de mensualidades de clientes vencidos o próximos a vencer.</div>
      ${pendientes.length===0 ? `<div class="faint">No hay pagos pendientes. 🎉</div>` :
        pendientes.map(c=>{ const e = estadoPago(c.proximoPago);
          return `<div class="list-item"><span>${esc(c.nombre)} · <span style="color:${e.c};">${e.t}</span></span><span>${fmtDinero(c.montoMensualidad)}</span></div>`;
        }).join("")}
    </div>
  </div>
  `;
}


function horasToStr(arr){ return (arr||[]).map(x=>x.hora).join(", "); }
function strToHoras(str, sufijoId){
  return str.split(",").map(x=>x.trim()).filter(x=>x!=="").map(x=>Number(x)).filter(x=>!isNaN(x) && x>=0 && x<24)
    .sort((a,b)=>a-b).map(h=>({ id:`h${h}${sufijoId||""}`, hora:h }));
}

function viewCliente(){
  const c = ctx.clienteDoc;
  if (!c) return `<div class="card faint" style="text-align:center;padding:30px;">Cargando tu perfil…</div>`;
  const valor = imc(c.peso,c.altura); const cat = imcCategoria(valor); const pago = estadoPago(c.proximoPago);

  const proximas = ctx.asignaciones.filter(a=>a.clienteId===c.id && a.fecha>=todayStr())
    .sort((a,b)=>a.fecha.localeCompare(b.fecha))
    .map(a=>({...a, slotLabel: (allSlots().find(s=>s.id===a.slotId)||{}).label || a.slotId}));

  const encuestaPendiente = ctx.asignaciones
    .filter(a=>a.clienteId===c.id && a.asistio===true && !a.animo && a.fecha>=addDays(todayStr(),-3))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];

  const dias = []; for(let i=0;i<6;i++) dias.push(addDays(ctx.weekStart,i));
  const contar = (fecha,slotId) => ctx.asignaciones.filter(a=>a.fecha===fecha && a.slotId===slotId).length;
  const misFechas = new Set(ctx.asignaciones.filter(a=>a.clienteId===c.id).map(a=>a.fecha));

  const board = `
  <div class="board"><div class="board-grid">
    ${dias.map(fecha=>{
      const dow = new Date(fecha+"T00:00:00").getDay();
      const slots = slotsForDate(fecha);
      const esHoy = fecha===todayStr();
      const esPasado = fecha < todayStr();
      return `
      <div>
        <div class="day-head ${esHoy?"today":""}">
          <div class="day-dow">${DIAS_CORTO[dow]}</div>
          <div class="day-num">${new Date(fecha+"T00:00:00").getDate()}</div>
        </div>
        <div class="slot-list">
          ${slots.map(s=>{
            const n = contar(fecha,s.id); const lleno = n>=ajustesActuales().capacidad; const ocupado = n>0 && !lleno;
            const esMia = ctx.asignaciones.some(a=>a.clienteId===c.id && a.fecha===fecha && a.slotId===s.id);
            const activa = ctx.selected && ctx.selected.fecha===fecha && ctx.selected.slotId===s.id;
            const muyPronto = !esMia && faltaAnticipacion(fecha, s);
            const bloqueado = esPasado || muyPronto || (lleno && !esMia) || (misFechas.has(fecha) && !esMia);
            return `<button class="slot-btn ${activa?"active":""} ${lleno&&!esMia?"full":""} ${ocupado&&!esMia?"ocupado":""} ${esMia?"mine":""}"
              ${bloqueado?"disabled":""}
              data-fecha="${fecha}" data-slot="${s.id}" data-label="${s.label}">
              <div>${s.label}${esMia?" ✓":""}</div>
              <div class="slot-count" style="color:${activa?"#1B1D1F":lleno&&!esMia?"var(--danger)":ocupado&&!esMia?"var(--accent)":"var(--muted)"};">${n}/${ajustesActuales().capacidad}</div>
              ${muyPronto ? `<div style="font-size:9px;color:var(--faint);margin-top:2px;">Requiere ${ajustesActuales().horasAnticipacion}h de anticipación</div>` : ``}
            </button>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}
  </div></div>`;

  let panel = "";
  if (ctx.selected){
    const yaAsignado = ctx.asignaciones.find(a=>a.clienteId===c.id && a.fecha===ctx.selected.fecha && a.slotId===ctx.selected.slotId);
    panel = `
    <div class="card" style="margin-top:14px;">
      <div class="row" style="justify-content:space-between;">
        <strong>${fmtFecha(ctx.selected.fecha)} · ${ctx.selected.slotLabel}</strong>
        <button class="btn-ghost" id="btnCerrarSel">Cerrar</button>
      </div>
      ${ctx.error ? `<div class="err" style="margin-top:8px;">${esc(ctx.error)}</div>` : ``}
      <div style="margin-top:10px;">
        ${yaAsignado
          ? `<button class="btn-danger" id="btnCancelarReserva" data-id="${yaAsignado.id}">Cancelar mi reserva</button>`
          : `<button class="btn-primary" id="btnReservar">Reservar esta clase</button>`}
      </div>
    </div>`;
  }

  return `
  <div class="grid" style="gap:16px;">
    <div class="card">
      <div style="font-size:20px;font-weight:900;">${esc(c.nombre)}</div>
      ${esCumpleañosHoy(c.fechaNacimiento) ? `<div class="pill" style="background:rgba(255,193,69,0.18);color:var(--warning);border:1px solid rgba(255,193,69,0.4);margin-top:8px;">🎂 ¡Feliz cumpleaños!</div>` : ``}
      <div class="grid grid-3" style="margin-top:14px;">
        <div><div class="stat-label">Peso</div><div class="stat-value">${c.peso?Number(c.peso)+" kg":"—"}</div></div>
        <div><div class="stat-label">Altura</div><div class="stat-value">${c.altura?Number(c.altura)+" cm":"—"}</div></div>
        <div><div class="stat-label">IMC</div><div class="stat-value">${valor?valor.toFixed(1):"—"}</div><div style="color:${cat.c};font-size:12px;font-weight:700;">${cat.t}</div></div>
      </div>
      <div class="grid grid-2" style="margin-top:14px;">
        <div><div class="stat-label">Racha actual</div><div class="stat-value">🔥 ${calcularRacha(c.id)} <span style="font-size:13px;color:var(--muted);">semana${calcularRacha(c.id)===1?"":"s"}</span></div></div>
        <div><div class="stat-label">Clases verificadas</div><div class="stat-value">${totalAsistencias(c.id)}</div></div>
      </div>
      ${insigniasCliente(c.id).length ? `
      <div style="margin-top:14px;">
        <div class="stat-label" style="margin-bottom:6px;">Insignias</div>
        <div class="row">${insigniasCliente(c.id).map(i=>`<span class="pill" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);">${i.e} ${i.label}</span>`).join("")}</div>
      </div>` : ``}
    </div>

    ${viewMiProgreso(c)}

    <div class="card">
      <h2>Estado de pago</h2>
      <span class="pill" style="background:${pago.c}22;color:${pago.c};border:1px solid ${pago.c}55;">${pago.t}</span>
      ${c.proximoPago ? `<span class="muted" style="margin-left:8px;">Próximo pago: ${fmtFecha(c.proximoPago)}</span>` : ``}
      <div style="margin-top:12px;">
        ${(c.pagos&&c.pagos.length) ? c.pagos.map(p=>`<div class="list-item"><span>${fmtFecha(p.fecha)}</span><span>${fmtDinero(p.monto)}</span></div>`).join("")
          : `<div class="faint">Sin pagos registrados todavía.</div>`}
      </div>
    </div>

    ${encuestaPendiente ? `
    <div class="card" style="border-color:var(--accent);">
      <h2>¿Cómo te sentiste en tu última clase?</h2>
      <div class="faint" style="margin-bottom:10px;">${fmtFecha(encuestaPendiente.fecha)} · ${(allSlots().find(s=>s.id===encuestaPendiente.slotId)||{}).label||""}</div>
      <div class="row">
        ${[["😄","Genial"],["🙂","Bien"],["😐","Normal"],["😫","Cansado"]].map(([em,label])=>
          `<button class="btn-ghost" data-encuesta="${encuestaPendiente.id}" data-animo="${em}" style="flex:1;flex-direction:column;padding:12px 6px;font-size:22px;">
            <div>${em}</div><div style="font-size:10px;margin-top:4px;">${label}</div>
          </button>`).join("")}
      </div>
    </div>` : ``}

    <div class="tabs">
      ${[["reservar","Reservar"],["muro","Muro"],["top","Top 10"]].map(([id,label])=>
        `<button class="tab ${ctx.clienteTab===id?"active":""}" data-clientetab="${id}">${label}</button>`).join("")}
    </div>

    ${ctx.clienteTab==="reservar" ? `
    <div class="card">
      <h2>Reservar una clase</h2>
      <div class="row" style="justify-content:space-between;margin-bottom:10px;">
        <div class="row">
          <button class="btn-ghost" id="btnSemAnt">‹</button>
          <strong style="font-size:13px;">${fmtFecha(dias[0])} – ${fmtFecha(dias[5])}</strong>

        </div>
        <button class="btn-ghost" id="btnHoy">Hoy</button>
      </div>
      ${board}
      ${panel}
      <div class="faint" style="margin-top:10px;">Máximo 1 clase por día. Las casillas marcadas con ✓ son tus reservas.
        Las reservas requieren mínimo ${ajustesActuales().horasAnticipacion} horas de anticipación.</div>
    </div>

    <div class="card">
      <h2>Mis próximas clases</h2>
      ${proximas.length===0 ? `<div class="faint">No tienes clases reservadas.</div>` :
        proximas.map(a=>`<div class="list-item"><span>${fmtFecha(a.fecha)}</span><span style="color:var(--accent);">${a.slotLabel}</span></div>`).join("")}
    </div>
    ` : ctx.clienteTab==="muro" ? viewMuro(c) : viewTop10() }

    <div>
      <h2>Mi cuenta</h2>
      <div id="cambiarPassCliente"></div>
    </div>
  </div>
  `;
}

function svgProgresoPeso(entradas){
  if (entradas.length < 2) return "";
  const W = 600, H = 160, padX = 10, padY = 20;
  const pesos = entradas.map(e=>Number(e.peso));
  const min = Math.min(...pesos), max = Math.max(...pesos);
  const rango = (max - min) || 1;
  const puntos = entradas.map((e,i)=>{
    const x = padX + (i/(entradas.length-1)) * (W - padX*2);
    const y = H - padY - ((Number(e.peso)-min)/rango) * (H - padY*2);
    return [x,y];
  });
  const linea = puntos.map(p=>p.join(",")).join(" ");
  const circulos = puntos.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${i===puntos.length-1?"#22C1E8":"#9AA0A6"}" />`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:140px;" preserveAspectRatio="none">
    <polyline points="${linea}" fill="none" stroke="#22C1E8" stroke-width="2.5" vector-effect="non-scaling-stroke" />
    ${circulos}
  </svg>`;
}

function viewMiProgreso(c){
  const historial = (c.historialPeso||[]).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const ultimos = historial.slice(-12);
  const primero = historial[0], ultimo = historial[historial.length-1];
  const diferencia = primero && ultimo ? (Number(ultimo.peso) - Number(primero.peso)) : null;
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <h2 style="margin:0;">Mi progreso de peso</h2>
      <button class="btn-ghost" id="btnAbrirRegistroPeso">+ Registrar peso</button>
    </div>
    <div id="formRegistroPeso"></div>
    ${historial.length===0 ? `<div class="faint" style="margin-top:10px;">Todavía no has registrado tu peso. Empieza hoy para ver tu evolución aquí.</div>` : `
      <div style="margin-top:12px;">${svgProgresoPeso(ultimos)}</div>
      ${diferencia!==null ? `<div class="faint" style="margin-top:6px;">Desde tu primer registro (${fmtFecha(primero.fecha)}): <strong style="color:${diferencia<=0?"var(--accent2)":"var(--warning)"};">${diferencia>0?"+":""}${diferencia.toFixed(1)} kg</strong></div>` : ``}
      <div style="margin-top:12px;display:flex;flex-direction:column-reverse;gap:6px;">
        ${historial.slice(-6).map(e=>`<div class="list-item"><span>${fmtFecha(e.fecha)}</span><span>${Number(e.peso)} kg</span></div>`).join("")}
      </div>
    `}
  </div>`;
}

function viewMuro(c){
  const posts = ctx.asignaciones.filter(a=>a.asistio===true)
    .sort((a,b)=> b.fecha.localeCompare(a.fecha))
    .slice(0,30);
  return `
  <div class="card">
    <h2>Muro de apoyo</h2>
    <div class="faint" style="margin-bottom:12px;">Asistencias verificadas por el administrador. Anima a tus compañeros con un emoji 👇</div>
    ${posts.length===0 ? `<div class="faint">Todavía no hay asistencias verificadas.</div>` :
      posts.map(a=>{
        const slot = allSlots().find(s=>s.id===a.slotId);
        const esYo = a.clienteId===c.id;
        return `
        <div class="list-item" style="flex-direction:column;align-items:stretch;gap:6px;">
          <div class="row" style="justify-content:space-between;">
            <span><strong>${esc(esYo?"Tú":nombrePerfil(a.clienteId))}</strong> ${mejorInsignia(a.clienteId)} asistió · ${fmtFecha(a.fecha)}${slot?` · ${slot.label}`:``}</span>
          </div>
          <div class="row">
            ${EMOJIS.map(em=>{
              const cuenta = ctx.reacciones.filter(r=>r.asignacionId===a.id && r.emoji===em).length;
              const mio = ctx.reacciones.some(r=>r.asignacionId===a.id && r.emoji===em && r.clienteId===c.id);
              return `<button class="btn-ghost" data-asig="${a.id}" data-emoji="${em}" data-reaccion
                style="padding:4px 9px;${mio?`background:rgba(34,193,232,0.2);border-color:var(--accent);`:``}">
                ${em} ${cuenta>0?cuenta:""}
              </button>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
  </div>`;
}

function viewTop10(){
  const conteo = {};
  ctx.asignaciones.filter(a=>a.asistio===true).forEach(a=>{ conteo[a.clienteId] = (conteo[a.clienteId]||0) + 1; });
  const ranking = Object.entries(conteo).map(([clienteId,total])=>({clienteId, total, nombre: nombrePerfil(clienteId)}))
    .sort((a,b)=>b.total-a.total).slice(0,10);
  const medallas = ["🥇","🥈","🥉"];
  return `
  <div class="card">
    <h2>Top 10 · Asistencia verificada</h2>
    ${ranking.length===0 ? `<div class="faint">Todavía no hay asistencias verificadas.</div>` :
      ranking.map((r,i)=>`
      <div class="list-item">
        <span style="width:26px;">${medallas[i]||(i+1)+"."}</span>
        <span style="flex:1;">${esc(r.nombre)} ${mejorInsignia(r.clienteId)}</span>
        <span style="color:var(--accent);font-weight:900;">${r.total}</span>
      </div>`).join("")}
    <div class="faint" style="margin-top:10px;">Solo cuentan las clases marcadas como asistidas por un administrador.</div>
  </div>`;
}

/* =========================================================
   7) MANEJO DE EVENTOS (delegación simple tras cada render)
   ========================================================= */
function bindEvents(){
  const q = (sel) => app.querySelector(sel);
  const qa = (sel) => Array.from(app.querySelectorAll(sel));

  const btnSalir = q("#btnSalir"); if (btnSalir) btnSalir.onclick = cerrarSesion;

  // COMPARTIR APP
  const btnCompartirApp = q("#btnCompartirApp");
  if (btnCompartirApp) btnCompartirApp.onclick = () => { ctx.mostrarCompartir = true; render(); };

  const cerrarCompartir = () => { ctx.mostrarCompartir = false; render(); };
  const btnCerrarCompartir = q("#btnCerrarCompartir"); if (btnCerrarCompartir) btnCerrarCompartir.onclick = cerrarCompartir;
  const btnCerrarCompartir2 = q("#btnCerrarCompartir2"); if (btnCerrarCompartir2) btnCerrarCompartir2.onclick = cerrarCompartir;
  const compartirOverlay = q("#compartirOverlay");
  if (compartirOverlay) compartirOverlay.onclick = (e) => { if (e.target === compartirOverlay) cerrarCompartir(); };

  const btnCopiarLink = q("#btnCopiarLink");
  if (btnCopiarLink) btnCopiarLink.onclick = async () => {
    const msg = q("#copiarMsg");
    try {
      await navigator.clipboard.writeText(APP_URL);
      if (msg) msg.innerHTML = `<div class="ok">¡Enlace copiado!</div>`;
    } catch (err) {
      if (msg) msg.innerHTML = `<div class="err">No se pudo copiar. Selecciona y copia el enlace manualmente.</div>`;
    }
  };

  // LOGIN
  const formLogin = q("#formLogin");
  if (formLogin) formLogin.onsubmit = async (e) => {
    e.preventDefault();
    ctx.error = "";
    try {
      await iniciarSesion(q("#loginUser").value, q("#loginPass").value);
    } catch (err) {
      ctx.error = "No se pudo iniciar sesión. Revisa tu usuario/correo y contraseña.";
      render();
    }
  };

  // BOOTSTRAP
  const formBootstrap = q("#formBootstrap");
  if (formBootstrap) formBootstrap.onsubmit = async (e) => {
    e.preventDefault();
    const nombre = q("#bsNombre").value.trim();
    if (!nombre) return;
    try {
      const batch = db.batch();
      batch.set(db.collection("admins").doc(ctx.user.uid), { nombre });
      batch.set(db.collection("config").doc("setup"), { creado: true, fecha: todayStr() });
      await batch.commit();
    } catch (err) {
      ctx.error = "Error real de Firebase: " + (err.code || "") + " — " + (err.message || err);
      render();
    }
  };

  if (!ctx.user || !ctx.rol) return;

  if (ctx.rol === "admin") bindAdminEvents(q, qa);
  if (ctx.rol === "cliente") bindClienteEvents(q, qa);
}

function bindAdminEvents(q, qa){
  qa("[data-admintab]").forEach(b => b.onclick = () => { ctx.adminTab = b.dataset.admintab; ctx.selected=null; ctx.error=""; render(); });
  qa("[data-mesfin]").forEach(b => b.onclick = () => { ctx.mesFinanzas = b.dataset.mesfin; render(); });

  const formAjustes = q("#formAjustes");
  if (formAjustes) formAjustes.onsubmit = async (e) => {
    e.preventDefault();
    ctx.error = ""; ctx.ajustesGuardado = false;
    const capacidad = Number(q("#ajCapacidad").value);
    const horasAnticipacion = Number(q("#ajAnticipacion").value);
    if (!capacidad || capacidad < 1) { ctx.error = "El cupo por clase debe ser al menos 1."; return render(); }
    if (horasAnticipacion < 0) { ctx.error = "Las horas de anticipación no pueden ser negativas."; return render(); }
    const horasManana = strToHoras(q("#ajManana").value);
    const horasTarde = strToHoras(q("#ajTarde").value);
    const horasSabado = strToHoras(q("#ajSabado").value, "sab");
    const runningActivo = q("#ajRunningActivo").checked;
    const runningHora = Number(q("#ajRunningHora").value);
    const nuevoAjustes = {
      capacidad, horasAnticipacion, horasManana, horasTarde, horasSabado,
      runningClub: runningActivo ? { id: `h${runningHora}run`, hora: runningHora } : null,
    };
    try {
      await db.collection("config").doc("ajustes").set(nuevoAjustes);
      ctx.ajustesGuardado = true;
      render();
    } catch (err) {
      ctx.error = "No se pudieron guardar los ajustes: " + (err.message || err);
      render();
    }
  };

  // --- Clientes ---
  const btnNuevo = q("#btnNuevoCliente");
  if (btnNuevo) btnNuevo.onclick = () => { q("#formNuevoCliente").innerHTML = formNuevoClienteHtml(); bindNuevoClienteForm(q); };

  const btnSinc = q("#btnSincronizarPerfiles");
  if (btnSinc) btnSinc.onclick = async () => {
    const batch = db.batch();
    ctx.clientes.forEach(c => batch.set(db.collection("perfiles").doc(c.id), { nombre: c.nombre }));
    await batch.commit();
    alert("Nombres públicos sincronizados.");
  };

  qa("[data-delcliente]").forEach(b => b.onclick = async () => {
    if (!confirm("¿Eliminar este cliente? (Su cuenta de acceso deberá eliminarse también desde Firebase Authentication)")) return;
    await db.collection("clientes").doc(b.dataset.delcliente).delete();
  });

  qa("[data-editcliente]").forEach(b => b.onclick = () => {
    const c = ctx.clientes.find(x=>x.id===b.dataset.editcliente);
    const holder = q(`[data-editform="${c.id}"]`);
    holder.innerHTML = `
      <div class="grid grid-3" style="margin-top:12px;">
        <div><label>Nombre</label><input id="ed-nombre-${c.id}" value="${esc(c.nombre)}" /></div>
        <div><label>Peso (kg)</label><input id="ed-peso-${c.id}" type="number" step="0.1" value="${c.peso||""}" /></div>
        <div><label>Altura (cm)</label><input id="ed-altura-${c.id}" type="number" value="${c.altura||""}" /></div>
        <div><label>Mensualidad ($)</label><input id="ed-monto-${c.id}" type="number" step="0.01" value="${c.montoMensualidad||""}" /></div>
        <div><label>Teléfono (solo admin)</label><input id="ed-tel-${c.id}" type="tel" value="${esc(c.telefono||"")}" /></div>
        <div><label>Fecha de nacimiento (solo admin)</label><input id="ed-nac-${c.id}" type="date" value="${c.fechaNacimiento||""}" /></div>
        <div class="row" style="align-items:end;"><button class="btn-primary" id="ed-guardar-${c.id}">Guardar</button></div>
      </div>`;
    q(`#ed-guardar-${c.id}`).onclick = async () => {
      const nuevoNombre = q(`#ed-nombre-${c.id}`).value.trim();
      const batch = db.batch();
      batch.update(db.collection("clientes").doc(c.id), {
        nombre: nuevoNombre,
        peso: Number(q(`#ed-peso-${c.id}`).value) || null,
        altura: Number(q(`#ed-altura-${c.id}`).value) || null,
        montoMensualidad: Number(q(`#ed-monto-${c.id}`).value) || 0,
        telefono: q(`#ed-tel-${c.id}`).value.trim() || null,
        fechaNacimiento: q(`#ed-nac-${c.id}`).value || null,
      });
      batch.set(db.collection("perfiles").doc(c.id), { nombre: nuevoNombre });
      await batch.commit();
      holder.innerHTML = "";
    };
  });

  qa("[data-pagocliente]").forEach(b => b.onclick = () => {
    const c = ctx.clientes.find(x=>x.id===b.dataset.pagocliente);
    const holder = q(`[data-pagoform="${c.id}"]`);
    holder.innerHTML = `
      <div class="row" style="margin-top:12px;align-items:end;">
        <div style="flex:1;min-width:120px;"><label>Fecha de pago</label><input id="pg-fecha-${c.id}" type="date" value="${todayStr()}" /></div>
        <div style="flex:1;min-width:100px;"><label>Monto</label><input id="pg-monto-${c.id}" type="number" step="0.01" value="${c.montoMensualidad||""}" /></div>
        <button class="btn-primary" id="pg-guardar-${c.id}">Registrar</button>
      </div>`;
    q(`#pg-guardar-${c.id}`).onclick = async () => {
      const fecha = q(`#pg-fecha-${c.id}`).value;
      const monto = Number(q(`#pg-monto-${c.id}`).value) || 0;
      const nuevoPago = { fecha, monto };
      await db.collection("clientes").doc(c.id).update({
        pagos: [nuevoPago, ...(c.pagos||[])],
        proximoPago: addMonths(fecha,1),
      });
      holder.innerHTML = "";
    };
  });

  // --- Clases ---
  const btnSemAnt = q("#btnSemAnt"); if (btnSemAnt) btnSemAnt.onclick = () => { ctx.weekStart = addDays(ctx.weekStart,-7); render(); };
  const btnSemSig = q("#btnSemSig"); if (btnSemSig) btnSemSig.onclick = () => { ctx.weekStart = addDays(ctx.weekStart,7); render(); };
  const btnHoy = q("#btnHoy"); if (btnHoy) btnHoy.onclick = () => { ctx.weekStart = mondayOf(todayStr()); render(); };
  qa(".slot-btn").forEach(b => b.onclick = () => {
    ctx.selected = { fecha: b.dataset.fecha, slotId: b.dataset.slot, slotLabel: b.dataset.label };
    ctx.error = ""; render();
  });
  const btnCerrarSel = q("#btnCerrarSel"); if (btnCerrarSel) btnCerrarSel.onclick = () => { ctx.selected = null; render(); };
  qa("[data-quitar]").forEach(b => b.onclick = async () => { await db.collection("asignaciones").doc(b.dataset.quitar).delete(); });
  qa("[data-toggleasistio]").forEach(b => b.onclick = async () => {
    const id = b.dataset.toggleasistio;
    const a = ctx.asignaciones.find(x=>x.id===id);
    await db.collection("asignaciones").doc(id).update({ asistio: !(a && a.asistio) });
  });
  const btnAsignar = q("#btnAsignar");
  if (btnAsignar) btnAsignar.onclick = async () => {
    const clienteId = q("#selCliente").value;
    if (!clienteId) { ctx.error = "Selecciona un cliente."; return render(); }
    const r = await intentarReservar(clienteId, ctx.selected.fecha, ctx.selected.slotId, "admin:"+(ctx.adminDoc?.nombre||""));
    if (!r.ok) { ctx.error = r.msg; render(); }
  };

  // --- Administradores ---
  const btnNuevoAdmin = q("#btnNuevoAdmin");
  if (btnNuevoAdmin) btnNuevoAdmin.onclick = () => {
    q("#formNuevoAdmin").innerHTML = `
      <div class="card">
        <form id="formAdmin" class="grid grid-3">
          <div><label>Nombre</label><input id="naNombre" required /></div>
          <div><label>Correo</label><input id="naCorreo" type="email" required /></div>
          <div><label>Contraseña inicial</label><input id="naPassword" type="password" required /></div>
          ${ctx.error ? `<div class="err" style="grid-column:1/-1;">${esc(ctx.error)}</div>` : ``}
          <div class="row" style="grid-column:1/-1;"><button class="btn-primary" type="submit">Crear</button></div>
        </form>
      </div>`;
    q("#formAdmin").onsubmit = async (e) => {
      e.preventDefault();
      try {
        const cred = await secondaryAuth.createUserWithEmailAndPassword(q("#naCorreo").value.trim(), q("#naPassword").value);
        await db.collection("admins").doc(cred.user.uid).set({ nombre: q("#naNombre").value.trim() });
        await secondaryAuth.signOut();
        q("#formNuevoAdmin").innerHTML = "";
      } catch (err) {
        ctx.error = err.message || "No se pudo crear el administrador.";
        render();
      }
    };
  };

  const cambiarPassAdmin = q("#cambiarPassAdmin");
  if (cambiarPassAdmin) renderCambiarPassword(cambiarPassAdmin);
}

function bindNuevoClienteForm(q){
  q("#btnCancelarCliente").onclick = () => { q("#formNuevoCliente").innerHTML = ""; ctx.error=""; };
  q("#formCliente").onsubmit = async (e) => {
    e.preventDefault();
    ctx.error = "";
    if (ctx.clientes.length >= MAX_CLIENTES) { ctx.error = `Límite de ${MAX_CLIENTES} clientes alcanzado.`; return render(); }
    const nombre = q("#ncNombre").value.trim();
    const usuario = q("#ncUsuario").value.trim();
    const password = q("#ncPassword").value;
    if (password.length < 6) { ctx.error = "La contraseña debe tener al menos 6 caracteres."; return render(); }
    try {
      const email = usuarioToEmail(usuario);
      const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
      const batch = db.batch();
      batch.set(db.collection("clientes").doc(cred.user.uid), {
        nombre,
        usuario: usuario.trim().toLowerCase().replace(/[^a-z0-9._-]/g, ""),
        peso: Number(q("#ncPeso").value) || null,
        altura: Number(q("#ncAltura").value) || null,
        montoMensualidad: Number(q("#ncMonto").value) || 0,
        telefono: q("#ncTelefono").value.trim() || null,
        fechaNacimiento: q("#ncNacimiento").value || null,
        proximoPago: null,
        pagos: [],
      });
      batch.set(db.collection("perfiles").doc(cred.user.uid), { nombre });
      await batch.commit();
      await secondaryAuth.signOut();
      q("#formNuevoCliente").innerHTML = "";
    } catch (err) {
      ctx.error = err.code === "auth/email-already-in-use" ? "Ese nombre de usuario ya está en uso." : (err.message || "No se pudo crear el cliente.");
      render();
    }
  };
}

function bindClienteEvents(q, qa){
  qa("[data-clientetab]").forEach(b => b.onclick = () => { ctx.clienteTab = b.dataset.clientetab; ctx.selected=null; ctx.error=""; render(); });

  const btnAbrirPeso = q("#btnAbrirRegistroPeso");
  if (btnAbrirPeso) btnAbrirPeso.onclick = () => {
    q("#formRegistroPeso").innerHTML = `
      <div class="row" style="margin-top:12px;align-items:end;">
        <div style="flex:1;min-width:120px;"><label>Fecha</label><input id="rpFecha" type="date" value="${todayStr()}" max="${todayStr()}" /></div>
        <div style="flex:1;min-width:100px;"><label>Peso (kg)</label><input id="rpPeso" type="number" step="0.1" min="1" /></div>
        <button class="btn-primary" id="rpGuardar">Guardar</button>
      </div>
      <div id="rpError"></div>`;
    q("#rpGuardar").onclick = async () => {
      const fecha = q("#rpFecha").value;
      const peso = Number(q("#rpPeso").value);
      if (!fecha || !peso || peso<=0) { q("#rpError").innerHTML = `<div class="err">Ingresa una fecha y un peso válidos.</div>`; return; }
      try {
        await db.collection("clientes").doc(ctx.user.uid).update({
          peso,
          historialPeso: firebase.firestore.FieldValue.arrayUnion({ fecha, peso }),
        });
        q("#formRegistroPeso").innerHTML = "";
      } catch (err) {
        q("#rpError").innerHTML = `<div class="err">No se pudo guardar: ${esc(err.message||String(err))}</div>`;
      }
    };
  };

  const btnSemAnt = q("#btnSemAnt"); if (btnSemAnt) btnSemAnt.onclick = () => { ctx.weekStart = addDays(ctx.weekStart,-7); render(); };
  const btnSemSig = q("#btnSemSig"); if (btnSemSig) btnSemSig.onclick = () => { ctx.weekStart = addDays(ctx.weekStart,7); render(); };
  const btnHoy = q("#btnHoy"); if (btnHoy) btnHoy.onclick = () => { ctx.weekStart = mondayOf(todayStr()); render(); };
  qa(".slot-btn").forEach(b => { if(!b.disabled) b.onclick = () => {
    ctx.selected = { fecha: b.dataset.fecha, slotId: b.dataset.slot, slotLabel: b.dataset.label };
    ctx.error = ""; render();
  };});
  const btnCerrarSel = q("#btnCerrarSel"); if (btnCerrarSel) btnCerrarSel.onclick = () => { ctx.selected = null; render(); };

  const btnReservar = q("#btnReservar");
  if (btnReservar) btnReservar.onclick = async () => {
    const r = await intentarReservar(ctx.user.uid, ctx.selected.fecha, ctx.selected.slotId, "cliente");
    if (!r.ok) { ctx.error = r.msg; render(); } else { ctx.selected = null; render(); }
  };
  const btnCancelar = q("#btnCancelarReserva");
  if (btnCancelar) btnCancelar.onclick = async () => {
    await db.collection("asignaciones").doc(btnCancelar.dataset.id).delete();
    ctx.selected = null; render();
  };

  qa("[data-encuesta]").forEach(b => b.onclick = async () => {
    await db.collection("asignaciones").doc(b.dataset.encuesta).update({ animo: b.dataset.animo });
  });

  qa("[data-reaccion]").forEach(b => b.onclick = async () => {
    const asignacionId = b.dataset.asig, emoji = b.dataset.emoji;
    const existente = ctx.reacciones.find(r=>r.asignacionId===asignacionId && r.emoji===emoji && r.clienteId===ctx.user.uid);
    if (existente) {
      await db.collection("reacciones").doc(existente.id).delete();
    } else {
      await db.collection("reacciones").add({ asignacionId, emoji, clienteId: ctx.user.uid });
    }
  });

  const cambiarPassCliente = q("#cambiarPassCliente");
  if (cambiarPassCliente) renderCambiarPassword(cambiarPassCliente);
}

async function intentarReservar(clienteId, fecha, slotId, creadoPor){
  const yaTiene = ctx.asignaciones.some(a=>a.clienteId===clienteId && a.fecha===fecha);
  if (yaTiene) return { ok:false, msg:"Ese cliente ya tiene una clase asignada ese día (máximo 1 diaria)." };
  const enSlot = ctx.asignaciones.filter(a=>a.fecha===fecha && a.slotId===slotId).length;
  if (enSlot >= ajustesActuales().capacidad) return { ok:false, msg:"Ese horario ya alcanzó su capacidad máxima." };
  if (creadoPor === "cliente") {
    const slot = allSlots().find(s=>s.id===slotId);
    if (slot && faltaAnticipacion(fecha, slot)) {
      return { ok:false, msg:`Las reservas requieren al menos ${ajustesActuales().horasAnticipacion} horas de anticipación.` };
    }
  }
  try {
    await db.collection("asignaciones").add({ clienteId, fecha, slotId, creadoPor });
    return { ok:true };
  } catch(err){
    return { ok:false, msg:"No se pudo guardar la reserva. Intenta de nuevo." };
  }
}

function renderCambiarPassword(holder){
  holder.innerHTML = `<button class="btn-ghost" id="btnAbrirCambioPass">Cambiar contraseña</button>`;
  holder.querySelector("#btnAbrirCambioPass").onclick = () => {
    holder.innerHTML = `
      <div class="card" style="max-width:340px;">
        <div class="grid" style="gap:10px;">
          <div><label>Contraseña actual</label><input id="cpActual" type="password" /></div>
          <div><label>Nueva contraseña</label><input id="cpNueva" type="password" /></div>
          <div id="cpMsg"></div>
          <div class="row"><button class="btn-primary" id="cpGuardar">Guardar</button><button class="btn-ghost" id="cpCerrar">Cerrar</button></div>
        </div>
      </div>`;
    holder.querySelector("#cpCerrar").onclick = () => renderCambiarPassword(holder);
    holder.querySelector("#cpGuardar").onclick = async () => {
      const actual = holder.querySelector("#cpActual").value;
      const nueva = holder.querySelector("#cpNueva").value;
      const msg = holder.querySelector("#cpMsg");
      if (nueva.length < 6) { msg.innerHTML = `<div class="err">Debe tener al menos 6 caracteres.</div>`; return; }
      try {
        const cred = firebase.auth.EmailAuthProvider.credential(ctx.user.email, actual);
        await ctx.user.reauthenticateWithCredential(cred);
        await ctx.user.updatePassword(nueva);
        msg.innerHTML = `<div class="ok">Contraseña actualizada.</div>`;
      } catch (err) {
        msg.innerHTML = `<div class="err">Contraseña actual incorrecta.</div>`;
      }
    };
  };
}
