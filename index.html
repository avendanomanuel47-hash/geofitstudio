<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Geofit Studio · Gimnasio</title>

<!-- PWA: instalable en Android -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B1D1F" />

<!-- PWA: soporte para iPhone (Safari no lee manifest.json para el ícono) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Geofit" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<style>
  :root{
    --bg:#1B1D1F; --surface:#232629; --surface2:#2A2E31; --surface3:#303538;
    --border:#383D40; --accent:#22C1E8; --accent-dim:#0F5C6E; --accent2:#3DDC97;
    --danger:#FF4757; --warning:#FFC145; --text:#F5F3EF; --muted:#9AA0A6; --faint:#6B7075;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{max-width:820px;margin:0 auto;padding:16px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;margin:-16px -16px 20px -16px;position:sticky;top:0;z-index:10;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:36px;height:36px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;color:#1B1D1F;font-size:18px;}
  .brand h1{font-size:17px;margin:0;text-transform:uppercase;letter-spacing:0.5px;font-weight:900;}
  .brand .sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px 0;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .grid{display:grid;gap:10px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:600px){.grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;}}
  label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:4px;}
  input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 12px;font-size:14px;}
  input::placeholder{color:var(--faint);}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.5px;font-size:12px;}
  .btn-primary{background:var(--accent);color:#1B1D1F;}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:rgba(255,71,87,0.15);color:var(--danger);border:1px solid rgba(255,71,87,0.4);}
  button:hover{opacity:0.9;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.5px;padding:4px 9px;border-radius:20px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);}
  .tab.active{border-color:var(--accent);color:var(--accent);}
  .err{color:var(--danger);font-size:12px;font-weight:700;}
  .ok{color:var(--accent2);font-size:12px;font-weight:700;}
  .faint{color:var(--faint);font-size:13px;}
  .muted{color:var(--muted);font-size:13px;}
  .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .stat-value{font-size:26px;font-weight:900;}
  .board{overflow-x:auto;margin:0 -16px;padding:0 16px;}
  .board-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-width:680px;}
  .day-head{text-align:center;border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;padding:8px;background:var(--surface2);}
  .day-head.today{background:var(--accent-dim);}
  .day-num{font-weight:900;font-size:15px;}
  .day-dow{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .slot-list{border:1px solid var(--border);border-radius:0 0 8px 8px;overflow:hidden;}
  .slot-btn{display:block;width:100%;text-align:left;padding:8px;font-size:11px;border:none;border-top:1px solid var(--border);
    background:var(--surface);color:var(--text);cursor:pointer;}
  .slot-btn:hover{opacity:0.9;}
  .slot-btn.active{background:var(--accent);color:#1B1D1F;}
  .slot-btn.ocupado{background:rgba(34,193,232,0.16);}
  .slot-btn.mine{background:rgba(61,220,151,0.18);}
  .slot-btn.full{background:rgba(255,71,87,0.16);}
  .slot-btn:disabled{opacity:0.45;cursor:not-allowed;}
  .slot-count{font-weight:900;}
  .list-item{display:flex;align-items:center;justify-content:between;background:var(--surface2);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:13px;}
  .list-item span:last-child{margin-left:auto;font-weight:700;}
  a.link{color:var(--accent);text-decoration:none;font-weight:700;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);
    text-transform:uppercase;letter-spacing:2px;font-size:13px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando Geofit Studio…</div></div>

<!-- Firebase SDK (modo compat, sin necesidad de herramientas de compilación) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   1) CONFIGURACION DE FIREBASE
   Reemplaza este objeto con el que copiaste desde tu proyecto
   de Firebase (Configuracion del proyecto > Tus apps > Web).
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBqCNtSfXK2Cn7TPDEAAlnIEHtHrfxOAw0",
  authDomain: "geofitstudio.firebaseapp.com",
  projectId: "geofitstudio",
  storageBucket: "geofitstudio.firebasestorage.app",
  messagingSenderId: "1059750270809",
  appId: "1:1059750270809:web:bc2a8293357404d2241e48"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// App secundaria: permite que un admin cree cuentas nuevas sin perder su propia sesion.
const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = secondaryApp.auth();

/* =========================================================
   2) CONSTANTES DEL GIMNASIO
   ========================================================= */
const CAPACIDAD = 5;
// Horarios de la mañana: lunes a jueves
const SLOTS_MANANA = [
  { id: "h07", label: "7:00 – 8:00", hora: 7 },
  { id: "h08", label: "8:00 – 9:00", hora: 8 },
];
// Horarios de la tarde: lunes a viernes
const SLOTS_TARDE = [
  { id: "h16", label: "16:00 – 17:00", hora: 16 },
  { id: "h17", label: "17:00 – 18:00", hora: 17 },
  { id: "h18", label: "18:00 – 19:00", hora: 18 },
  { id: "h19", label: "19:00 – 20:00", hora: 19 },
];
// Sábado: running club + horarios de la mañana
const SLOT_RUNNING = { id: "h06run", label: "6:00 – 7:00 · Running Club", hora: 6 };
const SLOTS_SABADO = [
  SLOT_RUNNING,
  { id: "h08sab", label: "8:00 – 9:00", hora: 8 },
  { id: "h09sab", label: "9:00 – 10:00", hora: 9 },
];
const DIAS_CORTO = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MAX_CLIENTES = 40;
const HORAS_ANTICIPACION = 3;
const DOMINIO_CLIENTES = "clientes.forja-gym.app"; // dominio ficticio para usuarios sin correo real

/* =========================================================
   3) UTILIDADES
   ========================================================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function addMonths(s,n){ const d=new Date(s+"T00:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function mondayOf(s){ const d=new Date(s+"T00:00:00"); const day=d.getDay(); const diff=day===0?-6:1-day; d.setDate(d.getDate()+diff); return d.toISOString().slice(0,10); }
function slotsForDate(s){
  const day=new Date(s+"T00:00:00").getDay();
  if(day===0) return [];               // domingo: sin clases
  if(day===6) return SLOTS_SABADO;      // sábado
  if(day===5) return SLOTS_TARDE;       // viernes: solo tarde
  return [...SLOTS_MANANA, ...SLOTS_TARDE]; // lunes a jueves
}
function fmtFecha(s){ return new Date(s+"T00:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"}); }
function imc(peso,alturaCm){ if(!peso||!alturaCm) return null; const m=alturaCm/100; return peso/(m*m); }
function imcCategoria(v){ if(v==null) return {t:"Sin datos",c:"var(--faint)"}; if(v<18.5) return {t:"Bajo peso",c:"var(--warning)"};
  if(v<25) return {t:"Normal",c:"var(--accent2)"}; if(v<30) return {t:"Sobrepeso",c:"var(--warning)"}; return {t:"Obesidad",c:"var(--danger)"}; }
function estadoPago(prox){ if(!prox) return {t:"Sin registro",c:"var(--faint)"};
  const diff=(new Date(prox+"T00:00:00")-new Date(todayStr()+"T00:00:00"))/86400000;
  if(diff<0) return {t:"Vencido",c:"var(--danger)"}; if(diff<=7) return {t:"Próximo a vencer",c:"var(--warning)"};
  return {t:"Al día",c:"var(--accent2)"}; }
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function usuarioToEmail(u){ const limpio=u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""); return `${limpio}@${DOMINIO_CLIENTES}`; }
function allSlots(){ return [...SLOTS_MANANA, ...SLOTS_TARDE, ...SLOTS_SABADO]; }
function inicioSlot(fecha, slot){ const d = new Date(fecha+"T00:00:00"); d.setHours(slot.hora,0,0,0); return d; }
function faltaAnticipacion(fecha, slot){
  const limite = new Date(Date.now() + HORAS_ANTICIPACION*60*60*1000);
  return inicioSlot(fecha, slot) < limite;
}



/* =========================================================
   4) ESTADO GLOBAL
   ========================================================= */
let ctx = {
  cargando: true,
  user: null,
  rol: null,        // 'admin' | 'cliente' | null
  adminDoc: null,
  clienteDoc: null,
  admins: [],
  clientes: [],
  asignaciones: [],
  setupExiste: null,
  adminTab: "clientes",
  weekStart: mondayOf(todayStr()),
  selected: null,
  error: "",
};
let unsubs = [];
function limpiarListeners(){ unsubs.forEach(u=>u&&u()); unsubs=[]; }

const app = document.getElementById("app");

/* =========================================================
   5) AUTENTICACION
   ========================================================= */
auth.onAuthStateChanged(async (user) => {
  limpiarListeners();
  ctx.error = "";
  if (!user) {
    ctx.user = null; ctx.rol = null; ctx.adminDoc = null; ctx.clienteDoc = null;
    const setupSnap = await db.collection("config").doc("setup").get();
    ctx.setupExiste = setupSnap.exists;
    ctx.cargando = false;
    render();
    return;
  }
  ctx.user = user;
  const [adminSnap, clienteSnap, setupSnap] = await Promise.all([
    db.collection("admins").doc(user.uid).get(),
    db.collection("clientes").doc(user.uid).get(),
    db.collection("config").doc("setup").get(),
  ]);
  ctx.setupExiste = setupSnap.exists;

  if (adminSnap.exists) {
    ctx.rol = "admin"; ctx.adminDoc = adminSnap.data();
    suscribirAdmin();
  } else if (clienteSnap.exists) {
    ctx.rol = "cliente"; ctx.clienteDoc = { id: user.uid, ...clienteSnap.data() };
    suscribirCliente();
  } else {
    ctx.rol = null;
  }
  ctx.cargando = false;
  render();
});

function suscribirAdmin(){
  unsubs.push(db.collection("admins").onSnapshot(qs=>{
    ctx.admins = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("clientes").onSnapshot(qs=>{
    ctx.clientes = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("asignaciones").onSnapshot(qs=>{
    ctx.asignaciones = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
}
function suscribirCliente(){
  unsubs.push(db.collection("clientes").doc(ctx.user.uid).onSnapshot(d=>{
    if(d.exists) ctx.clienteDoc = { id:d.id, ...d.data() }; render();
  }));
  unsubs.push(db.collection("asignaciones").where("clienteId","==",ctx.user.uid).onSnapshot(qs=>{
    ctx.asignaciones = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
  unsubs.push(db.collection("clientes").onSnapshot(qs=>{
    // se usa solo para saber cuantos clientes hay por dia al reservar (conteo por franja)
    ctx.clientes = qs.docs.map(d=>({id:d.id, ...d.data()})); render();
  }));
}

async function iniciarSesion(usuarioOCorreo, password){
  const email = usuarioOCorreo.includes("@") ? usuarioOCorreo.trim() : usuarioToEmail(usuarioOCorreo);
  await auth.signInWithEmailAndPassword(email, password);
}
async function cerrarSesion(){ await auth.signOut(); }

/* =========================================================
   6) RENDER PRINCIPAL
   ========================================================= */
function render(){
  if (ctx.cargando){ app.innerHTML = `<div class="loading">Cargando Geofit Studio…</div>`; return; }

  let header = `
    <header>
      <div class="brand">
        <div class="logo">G</div>
        <div><h1>Geofit Studio</h1><div class="sub">Panel del gimnasio</div></div>
      </div>
      ${ctx.user ? `
        <div class="row">
          <span class="muted" style="display:none" class="sub-name">${esc(ctx.rol==="admin"?ctx.adminDoc?.nombre:ctx.clienteDoc?.nombre)}</span>
          <button class="btn-ghost" id="btnSalir">Salir</button>
        </div>` : ``}
    </header>`;

  let body = "";
  if (!ctx.user) {
    body = viewLogin();
  } else if (ctx.rol === "admin") {
    body = viewAdmin();
  } else if (ctx.rol === "cliente") {
    body = viewCliente();
  } else if (!ctx.setupExiste) {
    body = viewBootstrap();
  } else {
    body = viewSinRol();
  }

  app.innerHTML = header + body;
  bindEvents();
}

/* ---------- LOGIN ---------- */
function viewLogin(){
  return `
  <div class="card" style="max-width:420px;margin:40px auto;">
    <h2 style="margin-bottom:16px;">Iniciar sesión</h2>
    <form id="formLogin" class="grid" style="gap:14px;">
      <div>
        <label>Usuario (clientes) o correo (administradores)</label>
        <input id="loginUser" placeholder="ej. juan.perez o admin@correo.com" required />
      </div>
      <div>
        <label>Contraseña</label>
        <input id="loginPass" type="password" placeholder="••••••••" required />
      </div>
      ${ctx.error ? `<div class="err">${esc(ctx.error)}</div>` : ``}
      <button class="btn-primary" type="submit">Ingresar</button>
    </form>
  </div>`;
}

function viewBootstrap(){
  return `
  <div class="card" style="max-width:420px;margin:40px auto;">
    <h2 style="margin-bottom:10px;">Configuración inicial</h2>
    <p class="faint" style="margin-bottom:16px;">Tu cuenta todavía no tiene un rol asignado, y aún no existe ningún administrador.
      Como fuiste la primera persona en entrar, puedes convertirte en el primer administrador del gimnasio.</p>
    <form id="formBootstrap" class="grid" style="gap:14px;">
      <div>
        <label>Tu nombre</label>
        <input id="bsNombre" placeholder="Nombre completo" required />
      </div>
      ${ctx.error ? `<div class="err">${esc(ctx.error)}</div>` : ``}
      <button class="btn-primary" type="submit">Convertirme en administrador</button>
    </form>
  </div>`;
}

function viewSinRol(){
  return `
  <div class="card" style="max-width:420px;margin:40px auto;text-align:center;">
    <h2 style="margin-bottom:10px;">Sin acceso asignado</h2>
    <p class="faint">Tu cuenta inició sesión correctamente, pero no tiene un perfil de cliente ni de administrador.
      Contacta a un administrador del gimnasio para que te dé de alta.</p>
  </div>`;
}

/* ---------- ADMIN ---------- */
function viewAdmin(){
  const tabs = [["clientes","Clientes"],["clases","Clases"],["admins","Administradores"]];
  return `
  <div class="tabs">
    ${tabs.map(([id,label])=>`<button class="tab ${ctx.adminTab===id?"active":""}" data-admintab="${id}">${label}</button>`).join("")}
  </div>
  ${ctx.adminTab==="clientes" ? viewAdminClientes() : ctx.adminTab==="clases" ? viewAdminClases() : viewAdminAdmins()}
  `;
}

function viewAdminClientes(){
  const rows = ctx.clientes.map(c=>{
    const valor = imc(c.peso,c.altura); const cat = imcCategoria(valor); const pago = estadoPago(c.proximoPago);
    return `
    <div class="card" data-clientecard="${c.id}">
      <div class="row" style="justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-weight:800;font-size:15px;">${esc(c.nombre)}</div>
          <div class="muted" style="margin-top:2px;">Usuario de acceso: <strong style="color:var(--accent);">${esc(c.usuario||"—")}</strong></div>
          <div class="muted" style="margin-top:2px;">${c.peso?c.peso+" kg":"Sin peso"} · ${c.altura?c.altura+" cm":"Sin altura"} · Mensualidad $${c.montoMensualidad||0}</div>
          <div class="row" style="margin-top:8px;">
            <span class="pill" style="background:${cat.c}22;color:${cat.c};border:1px solid ${cat.c}55;">IMC ${valor?valor.toFixed(1):"—"} · ${cat.t}</span>
            <span class="pill" style="background:${pago.c}22;color:${pago.c};border:1px solid ${pago.c}55;">${pago.t}${c.proximoPago?" · "+fmtFecha(c.proximoPago):""}</span>
          </div>
        </div>
        <div class="row" style="flex-shrink:0;">
          <button class="btn-ghost" data-editcliente="${c.id}">Editar</button>
          <button class="btn-ghost" data-pagocliente="${c.id}">Pago</button>
          <button class="btn-danger" data-delcliente="${c.id}">Eliminar</button>
        </div>
      </div>
      <div data-editform="${c.id}"></div>
      <div data-pagoform="${c.id}"></div>
      ${c.pagos && c.pagos.length ? `<div class="faint" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
        Últimos pagos: ${c.pagos.slice(0,3).map(p=>fmtFecha(p.fecha)+" ($"+p.monto+")").join("  ·  ")}</div>` : ``}
    </div>`;
  }).join("");

  return `
  <div class="row" style="justify-content:space-between;margin-bottom:14px;">
    <div class="muted"><strong style="color:var(--text);font-size:17px;">${ctx.clientes.length}</strong> / ${MAX_CLIENTES} clientes registrados</div>
    <button class="btn-primary" id="btnNuevoCliente">+ Nuevo cliente</button>
  </div>
  <div id="formNuevoCliente"></div>
  ${ctx.clientes.length===0 ? `<div class="card faint" style="text-align:center;padding:40px;">Aún no hay clientes.</div>` : rows}
  `;
}

function formNuevoClienteHtml(){
  return `
  <div class="card">
    <form id="formCliente" class="grid grid-3">
      <div><label>Nombre completo</label><input id="ncNombre" required /></div>
      <div><label>Usuario de acceso</label><input id="ncUsuario" placeholder="ej. juan.perez" required /></div>
      <div><label>Contraseña inicial</label><input id="ncPassword" type="password" placeholder="mínimo 6 caracteres" required /></div>
      <div><label>Peso (kg)</label><input id="ncPeso" type="number" step="0.1" /></div>
      <div><label>Altura (cm)</label><input id="ncAltura" type="number" /></div>
      <div><label>Mensualidad ($)</label><input id="ncMonto" type="number" step="0.01" /></div>
      ${ctx.error ? `<div class="err" style="grid-column:1/-1;">${esc(ctx.error)}</div>` : ``}
      <div class="row" style="grid-column:1/-1;">
        <button class="btn-primary" type="submit">Guardar</button>
        <button class="btn-ghost" type="button" id="btnCancelarCliente">Cancelar</button>
      </div>
    </form>
  </div>`;
}

function viewAdminClases(){
  const dias = []; for(let i=0;i<6;i++) dias.push(addDays(ctx.weekStart,i));
  const contar = (fecha,slotId) => ctx.asignaciones.filter(a=>a.fecha===fecha && a.slotId===slotId).length;

  const board = `
  <div class="board"><div class="board-grid">
    ${dias.map(fecha=>{
      const dow = new Date(fecha+"T00:00:00").getDay();
      const slots = slotsForDate(fecha);
      const esHoy = fecha===todayStr();
      return `
      <div>
        <div class="day-head ${esHoy?"today":""}">
          <div class="day-dow">${DIAS_CORTO[dow]}</div>
          <div class="day-num">${new Date(fecha+"T00:00:00").getDate()}</div>
        </div>
        <div class="slot-list">
          ${slots.map(s=>{
            const n = contar(fecha,s.id); const lleno = n>=CAPACIDAD; const ocupado = n>0 && !lleno;
            const activa = ctx.selected && ctx.selected.fecha===fecha && ctx.selected.slotId===s.id;
            return `<button class="slot-btn ${activa?"active":""} ${lleno?"full":""} ${ocupado?"ocupado":""}" data-fecha="${fecha}" data-slot="${s.id}" data-label="${s.label}">
              <div>${s.label}</div><div class="slot-count" style="color:${activa?"#1B1D1F":lleno?"var(--danger)":ocupado?"var(--accent)":"var(--muted)"};">${n}/${CAPACIDAD}</div>
            </button>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}

  let panel = `<div class="faint" style="text-align:center;padding:24px;">Selecciona un horario del tablero.</div>`;
  if (ctx.selected){
    const asignados = ctx.asignaciones.filter(a=>a.fecha===ctx.selected.fecha && a.slotId===ctx.selected.slotId);
    const disponibles = ctx.clientes.filter(c=>!ctx.asignaciones.some(a=>a.clienteId===c.id && a.fecha===ctx.selected.fecha));
    panel = `
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <strong>${fmtFecha(ctx.selected.fecha)} · ${ctx.selected.slotLabel}</strong>
        <button class="btn-ghost" id="btnCerrarSel">Cerrar</button>
      </div>
      <div style="margin-top:10px;">
        ${asignados.length===0 ? `<div class="faint">Sin clientes asignados todavía.</div>` :
          asignados.map(a=>{
            const c = ctx.clientes.find(x=>x.id===a.clienteId);
            return `<div class="list-item"><span>${esc(c?c.nombre:"Cliente eliminado")}</span>
              <button class="btn-danger" data-quitar="${a.id}" style="margin-left:auto;">Quitar</button></div>`;
          }).join("")}
      </div>
      ${disponibles.length===0 ? `<div class="faint" style="margin-top:10px;">No hay clientes disponibles ese día.</div>` : `
      <div class="row" style="margin-top:12px;">
        <div style="flex:1;min-width:180px;">
          <label>Agregar cliente</label>
          <select id="selCliente"><option value="">Selecciona...</option>
            ${disponibles.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select>
        </div>
        <button class="btn-primary" id="btnAsignar" style="margin-top:18px;">+ Asignar</button>
      </div>`}
      ${ctx.error ? `<div class="err" style="margin-top:8px;">${esc(ctx.error)}</div>` : ``}

  }

  return `
  <div class="row" style="justify-content:space-between;margin-bottom:14px;">
    <div class="row">
      <button class="btn-ghost" id="btnSemAnt">‹</button>
      <strong>Semana del ${fmtFecha(dias[0])} al ${fmtFecha(dias[5])}</strong>
      <button class="btn-ghost" id="btnSemSig">›</button>
    </div>
    <button class="btn-ghost" id="btnHoy">Hoy</button>
  </div>

  <div style="margin-top:16px;">${panel}</div>
  `;
}

/* ---------- CLIENTE ---------- */
function viewCliente(){
  const c = ctx.clienteDoc;
  if (!c) return `<div class="card faint" style="text-align:center;padding:30px;">Cargando tu perfil…</div>`;
  const valor = imc(c.peso,c.altura); const cat = imcCategoria(valor); const pago = estadoPago(c.proximoPago);

  const proximas = ctx.asignaciones.filter(a=>a.clienteId===c.id && a.fecha>=todayStr())
    .sort((a,b)=>a.fecha.localeCompare(b.fecha))
    .map(a=>({...a, slotLabel: (allSlots().find(s=>s.id===a.slotId)||{}).label || a.slotId}));

  const dias = []; for(let i=0;i<6;i++) dias.push(addDays(ctx.weekStart,i));
  const contar = (fecha,slotId) => ctx.asignaciones.filter(a=>a.fecha===fecha && a.slotId===slotId).length;
  const misFechas = new Set(ctx.asignaciones.filter(a=>a.clienteId===c.id).map(a=>a.fecha));

  const board = `
  <div class="board"><div class="board-grid">
    ${dias.map(fecha=>{
      const dow = new Date(fecha+"T00:00:00").getDay();
      const slots = slotsForDate(fecha);
      const esHoy = fecha===todayStr();
      const esPasado = fecha < todayStr();
      return `
      <div>
        <div class="day-head ${esHoy?"today":""}">
          <div class="day-dow">${DIAS_CORTO[dow]}</div>
          <div class="day-num">${new Date(fecha+"T00:00:00").getDate()}</div>
        </div>
        <div class="slot-list">
          ${slots.map(s=>{
            const n = contar(fecha,s.id); const lleno = n>=CAPACIDAD; const ocupado = n>0 && !lleno;
            const esMia = ctx.asignaciones.some(a=>a.clienteId===c.id && a.fecha===fecha && a.slotId===s.id);
            const activa = ctx.selected && ctx.selected.fecha===fecha && ctx.selected.slotId===s.id;
            const muyPronto = !esMia && faltaAnticipacion(fecha, s);
            const bloqueado = esPasado || muyPronto || (lleno && !esMia) || (misFechas.has(fecha) && !esMia);
            return `<button class="slot-btn ${activa?"active":""} ${lleno&&!esMia?"full":""} ${ocupado&&!esMia?"ocupado":""} ${esMia?"mine":""}"
              ${bloqueado?"disabled":""}
              data-fecha="${fecha}" data-slot="${s.id}" data-label="${s.label}">
              <div>${s.label}${esMia?" ✓":""}</div>
              <div class="slot-count" style="color:${activa?"#1B1D1F":lleno&&!esMia?"var(--danger)":ocupado&&!esMia?"var(--accent)":"var(--muted)"};">${n}/${CAPACIDAD}</div>
              ${muyPronto ? `<div style="font-size:9px;color:var(--faint);margin-top:2px;">Requiere ${HORAS_ANTICIPACION}h de anticipación</div>` : ``}
            </button>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}
  </div></div>`;

  let panel = "";
  if (ctx.selected){
    const yaAsignado = ctx.asignaciones.find(a=>a.clienteId===c.id && a.fecha===ctx.selected.fecha && a.slotId===ctx.selected.slotId);
    panel = `
    <div class="card" style="margin-top:14px;">
      <div class="row" style="justify-content:space-between;">
        <strong>${fmtFecha(ctx.selected.fecha)} · ${ctx.selected.slotLabel}</strong>
        <button class="btn-ghost" id="btnCerrarSel">Cerrar</button>
      </div>
      ${ctx.error ? `<div class="err" style="margin-top:8px;">${esc(ctx.error)}</div>` : ``}
      <div style="margin-top:10px;">
        ${yaAsignado
          ? `<button class="btn-danger" id="btnCancelarReserva" data-id="${yaAsignado.id}">Cancelar mi reserva</button>`
          : `<button class="btn-primary" id="btnReservar">Reservar esta clase</button>`}
      </div>
    </div>`;
  }

  return `
  <div class="grid" style="gap:16px;">
    <div class="card">
      <div style="font-size:20px;font-weight:900;">${esc(c.nombre)}</div>
      <div class="grid grid-3" style="margin-top:14px;">
        <div><div class="stat-label">Peso</div><div class="stat-value">${c.peso?c.peso+" kg":"—"}</div></div>
        <div><div class="stat-label">Altura</div><div class="stat-value">${c.altura?c.altura+" cm":"—"}</div></div>
        <div><div class="stat-label">IMC</div><div class="stat-value">${valor?valor.toFixed(1):"—"}</div><div style="color:${cat.c};font-size:12px;font-weight:700;">${cat.t}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Estado de pago</h2>
      <span class="pill" style="background:${pago.c}22;color:${pago.c};border:1px solid ${pago.c}55;">${pago.t}</span>
      ${c.proximoPago ? `<span class="muted" style="margin-left:8px;">Próximo pago: ${fmtFecha(c.proximoPago)}</span>` : ``}
      <div style="margin-top:12px;">
        ${(c.pagos&&c.pagos.length) ? c.pagos.map(p=>`<div class="list-item"><span>${fmtFecha(p.fecha)}</span><span>$${p.monto}</span></div>`).join("")
          : `<div class="faint">Sin pagos registrados todavía.</div>`}
      </div>
    </div>

    <div class="card">
      <h2>Reservar una clase</h2>
      <div class="row" style="justify-content:space-between;margin-bottom:10px;">
        <div class="row">
          <button class="btn-ghost" id="btnSemAnt">‹</button>
          <strong style="font-size:13px;">${fmtFecha(dias[0])} – ${fmtFecha(dias[5])}</strong>
          <button class="btn-ghost" id="btnSemSig">›</button>
        </div>
        <button class="btn-ghost" id="btnHoy">Hoy</button>
      </div>
      ${board}
      ${panel}
      <div class="faint" style="margin-top:10px;">Máximo 1 clase por día. Las casillas marcadas con ✓ son tus reservas.</div>
    </div>

    <div class="card">
      <h2>Mis próximas clases</h2>
      ${proximas.length===0 ? `<div class="faint">No tienes clases reservadas.</div>` :
        proximas.map(a=>`<div class="list-item"><span>${fmtFecha(a.fecha)}</span><span style="color:var(--accent);">${a.slotLabel}</span></div>`).join("")}
    </div>

    <div>
      <h2>Mi cuenta</h2>
      <div id="cambiarPassCliente"></div>
    </div>
  </div>
  `;
}

/* =========================================================
   7) MANEJO DE EVENTOS (delegación simple tras cada render)
   ========================================================= */
function bindEvents(){
  const q = (sel) => app.querySelector(sel);
  const qa = (sel) => Array.from(app.querySelectorAll(sel));

  const btnSalir = q("#btnSalir"); if (btnSalir) btnSalir.onclick = cerrarSesion;

  // LOGIN
  const formLogin = q("#formLogin");
  if (formLogin) formLogin.onsubmit = async (e) => {
    e.preventDefault();
    ctx.error = "";
    try {
      await iniciarSesion(q("#loginUser").value, q("#loginPass").value);
    } catch (err) {
      ctx.error = "No se pudo iniciar sesión. Revisa tu usuario/correo y contraseña.";
      render();
    }
  };

  // BOOTSTRAP
  const formBootstrap = q("#formBootstrap");
  if (formBootstrap) formBootstrap.onsubmit = async (e) => {
    e.preventDefault();
    const nombre = q("#bsNombre").value.trim();
    if (!nombre) return;
    try {
      const batch = db.batch();
      batch.set(db.collection("admins").doc(ctx.user.uid), { nombre });
      batch.set(db.collection("config").doc("setup"), { creado: true, fecha: todayStr() });
      await batch.commit();
    } catch (err) {
      ctx.error = "Error real de Firebase: " + (err.code || "") + " — " + (err.message || err);
      render();
    }
  };

  if (!ctx.user || !ctx.rol) return;

  if (ctx.rol === "admin") bindAdminEvents(q, qa);
  if (ctx.rol === "cliente") bindClienteEvents(q, qa);
}

        <button class="btn-primary" id="pg-guardar-${c.id}">Registrar</button>

      const fecha = q(`#pg-fecha-${c.id}`).value;

      const nuevoPago = { fecha, monto };
      await db.collection("clientes").doc(c.id).update({
        pagos: [nuevoPago, ...(c.pagos||[])],

    if (!r.ok) { ctx.error = r.msg; render(); }

  const btnNuevoAdmin = q("#btnNuevoAdmin");

function bindNuevoClienteForm(q){
  q("#btnCancelarCliente").onclick = () => { q("#formNuevoCliente").innerHTML = ""; ctx.error=""; };
  q("#formCliente").onsubmit = async (e) => {
    e.preventDefault();
    ctx.error = "";
    if (ctx.clientes.length >= MAX_CLIENTES) { ctx.error = `Límite de ${MAX_CLIENTES} clientes alcanzado.`; return render(); }
    const nombre = q("#ncNombre").value.trim();
    const usuario = q("#ncUsuario").value.trim();
    const password = q("#ncPassword").value;
    if (password.length < 6) { ctx.error = "La contraseña debe tener al menos 6 caracteres."; return render(); }
    try {
      const email = usuarioToEmail(usuario);
      const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
      await db.collection("clientes").doc(cred.user.uid).set({
        nombre,
        usuario: usuario.trim().toLowerCase().replace(/[^a-z0-9._-]/g, ""),
        peso: Number(q("#ncPeso").value) || null,
        altura: Number(q("#ncAltura").value) || null,
        montoMensualidad: Number(q("#ncMonto").value) || 0,
        proximoPago: null,
        pagos: [],
      });
      await secondaryAuth.signOut();
      q("#formNuevoCliente").innerHTML = "";
    } catch (err) {
      ctx.error = err.code === "auth/email-already-in-use" ? "Ese nombre de usuario ya está en uso." : (err.message || "No se pudo crear el cliente.");
      render();
    }
  };
}

function bindClienteEvents(q, qa){
  const btnSemAnt = q("#btnSemAnt"); if (btnSemAnt) btnSemAnt.onclick = () => { ctx.weekStart = addDays(ctx.weekStart,-7); render(); };
  const btnSemSig = q("#btnSemSig"); if (btnSemSig) btnSemSig.onclick = () => { ctx.weekStart = addDays(ctx.weekStart,7); render(); };
  const btnHoy = q("#btnHoy"); if (btnHoy) btnHoy.onclick = () => { ctx.weekStart = mondayOf(todayStr()); render(); };
  qa(".slot-btn").forEach(b => { if(!b.disabled) b.onclick = () => {
    ctx.selected = { fecha: b.dataset.fecha, slotId: b.dataset.slot, slotLabel: b.dataset.label };
    ctx.error = ""; render();
  };});
  const btnCerrarSel = q("#btnCerrarSel"); if (btnCerrarSel) btnCerrarSel.onclick = () => { ctx.selected = null; render(); };

  const btnReservar = q("#btnReservar");
  if (btnReservar) btnReservar.onclick = async () => {
    const r = await intentarReservar(ctx.user.uid, ctx.selected.fecha, ctx.selected.slotId, "cliente");
    if (!r.ok) { ctx.error = r.msg; render(); } else { ctx.selected = null; render(); }
  };
  const btnCancelar = q("#btnCancelarReserva");
  if (btnCancelar) btnCancelar.onclick = async () => {
    await db.collection("asignaciones").doc(btnCancelar.dataset.id).delete();
    ctx.selected = null; render();
  };

  const cambiarPassCliente = q("#cambiarPassCliente");
  if (cambiarPassCliente) renderCambiarPassword(cambiarPassCliente);
}

async function intentarReservar(clienteId, fecha, slotId, creadoPor){
  const yaTiene = ctx.asignaciones.some(a=>a.clienteId===clienteId && a.fecha===fecha);
  if (yaTiene) return { ok:false, msg:"Ese cliente ya tiene una clase asignada ese día (máximo 1 diaria)." };
  const enSlot = ctx.asignaciones.filter(a=>a.fecha===fecha && a.slotId===slotId).length;
  if (enSlot >= CAPACIDAD) return { ok:false, msg:"Ese horario ya alcanzó su capacidad máxima." };
  if (creadoPor === "cliente") {
    const slot = allSlots().find(s=>s.id===slotId);
    if (slot && faltaAnticipacion(fecha, slot)) {
      return { ok:false, msg:`Las reservas requieren al menos ${HORAS_ANTICIPACION} horas de anticipación.` };
    }
  }
  try {
    await db.collection("asignaciones").add({ clienteId, fecha, slotId, creadoPor });
    return { ok:true };
  } catch(err){
    return { ok:false, msg:"No se pudo guardar la reserva. Intenta de nuevo." };
  }
}

function renderCambiarPassword(holder){
  holder.innerHTML = `<button class="btn-ghost" id="btnAbrirCambioPass">Cambiar contraseña</button>`;
  holder.querySelector("#btnAbrirCambioPass").onclick = () => {
    holder.innerHTML = `
      <div class="card" style="max-width:340px;">
        <div class="grid" style="gap:10px;">
          <div><label>Contraseña actual</label><input id="cpActual" type="password" /></div>
          <div><label>Nueva contraseña</label><input id="cpNueva" type="password" /></div>
          <div id="cpMsg"></div>
          <div class="row"><button class="btn-primary" id="cpGuardar">Guardar</button><button class="btn-ghost" id="cpCerrar">Cerrar</button></div>
        </div>
      </div>`;
    holder.querySelector("#cpCerrar").onclick = () => renderCambiarPassword(holder);
    holder.querySelector("#cpGuardar").onclick = async () => {
      const actual = holder.querySelector("#cpActual").value;
      const nueva = holder.querySelector("#cpNueva").value;
      const msg = holder.querySelector("#cpMsg");
      if (nueva.length < 6) { msg.innerHTML = `<div class="err">Debe tener al menos 6 caracteres.</div>`; return; }
      try {
        const cred = firebase.auth.EmailAuthProvider.credential(ctx.user.email, actual);
        await ctx.user.reauthenticateWithCredential(cred);
        await ctx.user.updatePassword(nueva);
        msg.innerHTML = `<div class="ok">Contraseña actualizada.</div>`;
      } catch (err) {
        msg.innerHTML = `<div class="err">Contraseña actual incorrecta.</div>`;
      }
    };
  };
}

// Registro del service worker: habilita el "Instalar app" en Android.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
